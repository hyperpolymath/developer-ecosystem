# SPDX-License-Identifier: MPL-2.0
[package]
name = "tlaiser"
version = "0.1.0"
edition = "2024"
authors = ["Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"]
description = "Extract state machine specs from existing code and model-check with TLA+/PlusCal"
license-file = "LICENSE"
repository = "https://github.com/hyperpolymath/tlaiser"
keywords = ["tla-plus", "model-checking", "concurrency", "verification"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
thiserror = "2"
handlebars = "6"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
