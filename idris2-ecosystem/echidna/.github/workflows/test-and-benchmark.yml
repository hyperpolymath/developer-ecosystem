        echo "- **Term Lookup**: < 1000 ns/operation" >> TESTING.md
        echo "- **Term Search**: < 5000 ns/operation (across 6000 terms)" >> TESTING.md
        echo "- **Category Filter**: < 100 ns/operation (indexed)" >> TESTING.md
        echo "- **Theorem Analysis**: < 10000 ns/operation" >> TESTING.md
        echo "- **Prover Recommendation**: < 2000 ns/operation" >> TESTING.md
        echo "- **Natural Language**: < 50000 ns/operation (full pipeline)" >> TESTING.md
        echo "" >> TESTING.md
        echo "## Running Tests Locally" >> TESTING.md
        echo "" >> TESTING.md
        echo "### Unit Tests" >> TESTING.md
        echo "```bash" >> TESTING.md
        echo "cd /path/to/echidna" >> TESTING.md
        echo "idris2 --test test/VocabularyTest.idr" >> TESTING.md
        echo "```" >> TESTING.md
        echo "" >> TESTING.md
        echo "### Benchmarks" >> TESTINGMD.md
        echo "```bash" >> TESTING.md
        echo "cd /path/to/echidna" >> TESTING.md
        echo "idris2 --exec bench/VocabularyBench.idr" >> TESTING.md
        echo "```" >> TESTING.md
        echo "" >> TESTING.md
        echo "### Full Test Suite" >> TESTING.md
        echo "```bash" >> TESTING.md
        echo "cd /path/to/echidna" >> TESTING.md
        echo "make test  # Runs all tests and benchmarks" >> TESTING.md
        echo "```" >> TESTING.md
    
    - name: Commit documentation
      run: |
        git config --global user.name "ECHIDNA CI"
        git config --global user.email "ci@echidna.example.com"
