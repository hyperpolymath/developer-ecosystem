version = 1
name = "test"
profile = "default"

[meta]
description = "Test manifest"
owner = "testuser"
shell = "bash"

[policy]
auto_write = false
require_explicit_commit = true
keep_previous = true
allow_plaintext_secrets = false

[[paths.entries]]
name = "local_bin"
value = "~/bin"
position = "append"
enabled = true
region = "user"

[env.EDITOR]
value = "nvim"
type = "string"
region = "core"
export = true
secret = false
enabled = true

[secrets.aws_key]
ref = "secret://aws/access_key"
type = "token"
region = "secrets"
exposure = "process"
required = true
enabled = true

[integrations.bash]
enabled = true
mode = "source-snippet"
target = "~/.bashrc"

[generation]
render_paths = true
render_env = true
render_wrappers = false
render_aliases = false

[generation.validation]
bash_syntax_check = true
