# eclexiaiser manifest — energy/carbon resource budgets
# SPDX-License-Identifier: MPL-2.0

[project]
name = "czech-file-knife"

[[functions]]
name = "reversible_capture"
source = "src/cfk-core/src/reversible.rs"
energy-budget-mj = 5.0
carbon-budget-mg = 1.0

[[functions]]
name = "local_backend_io"
source = "src/cfk-providers/src/local.rs"
energy-budget-mj = 5.0
carbon-budget-mg = 1.0

[carbon]
provider = "static"
region = "GB"
static-intensity = 200.0

[report]
format = "text"
include-recommendations = true
