# SPDX-License-Identifier: MPL-2.0
#
# csp.conf — canonical security-header set for sites deployed from this
# bundle (source of record; the webservers/ examples embed these values and
# must be kept in sync with this file — see README.adoc in this directory).
#
# Form: one `Header-Name: value` per line, suitable for nginx include
# snippets (add_header), Apache mod_headers (Header always set) and manual
# transcription into Caddy header blocks.
#
# Deliberate omissions:
#   X-XSS-Protection — deprecated; modern guidance is to not send it (it is
#     an attack surface in legacy browsers). CSP frame-ancestors + XFO cover
#     the same ground.
#   Expect-CT — obsolete; CT is enforced by browsers via policy.
Content-Security-Policy: default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; upgrade-insecure-requests
Strict-Transport-Security: max-age=31536000; includeSubDomains; preload
X-Content-Type-Options: nosniff
X-Frame-Options: DENY
Referrer-Policy: strict-origin-when-cross-origin
Permissions-Policy: geolocation=(), camera=(), microphone=(), browsing-topics=()
Cross-Origin-Opener-Policy: same-origin
Cross-Origin-Resource-Policy: same-origin
